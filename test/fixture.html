<!DOCTYPE html>
<!--
  Form Field Find & Replace - test fixture (phase 2 + phase 3 + phase 6).

  Expected counts, computed against content/find-replace.js's collectFields
  + describeField rules:

    Non-skipped fields collected by collectFields(document) - i.e. with NO
    `includeIframes` option set - with NO field-type filtering applied: 12
      - #text-input           (kind: input,  type: text)
      - #email-input          (kind: input,  type: email)
      - #textarea-input       (kind: textarea, type: textarea)
      - #contenteditable-div  (kind: contenteditable, type: contenteditable)
      - #number-input         (kind: input,  type: number)
      - #date-input           (kind: input,  type: date)
      - #datetime-local-input (kind: input,  type: datetime-local)
      - #month-input          (kind: input,  type: month)
      - #week-input           (kind: input,  type: week)
      - #time-input           (kind: input,  type: time)
      - #controlled-input     (kind: input,  type: text)
      - #shadow-input         (kind: input,  type: text) - inside an OPEN
        shadow root; collected unconditionally (shadow-root recursion does
        NOT depend on the includeIframes option), see phase 6.

    Additionally collected ONLY when collectFields(document, {includeIframes:
    true}) is called (phase 6):
      - #iframe-input (kind: input, type: text) - inside #same-origin-iframe,
        a same-origin (srcdoc) iframe.

    NEVER collected, by design (phase 6):
      - #closed-shadow-input - inside a CLOSED shadow root attached to
        #closed-shadow-host. `Element.shadowRoot` is null for a closed root,
        so it is genuinely unreachable, not merely filtered - proves closed
        shadow roots are skipped without error.
      - anything inside #cross-origin-iframe - a `sandbox`-ed iframe with no
        `allow-same-origin` token, which forces its content into an OPAQUE
        origin distinct from the parent document regardless of `src`. This
        is the offline-friendly mechanism used here (see that iframe's own
        comment below) to reliably produce the same "cannot access
        contentDocument" condition a genuinely cross-origin frame would -
        without any network access. Accessing it must never throw out of
        collectFields and must never abort collection of the rest of the
        tree.

    Always-skipped (must NOT appear in collectFields output):
      - #password-input  (type="password")
      - #disabled-input  (disabled)
      - #readonly-input  (readonly)

    Seeded text, for match-count assertions (the needle "hello",
    case-insensitive, plain mode):
      - #text-input value="hello world hello"                -> 2 matches
      - #email-input value="hello@example.com"                -> 1 match
      - #textarea-input text="hello there, hello again"       -> 2 matches
      - #contenteditable-div textContent "hello world hello there" -> 2 matches
      Total across those 4 fields: 7 matches in 4 fields.

    The password/disabled/readonly fields also contain "hello" in their
    value, specifically to prove those matches are NEVER counted or touched.

    The number/date/datetime-local/month/week/time inputs and the
    controlled-input widget (added in phase 3) are prefilled with values
    that do NOT contain "hello", so the "hello" match-count assertions
    above are unaffected by their addition - they exist to exercise the
    replace path's native-setter and format-validation-rollback behavior
    instead (see test/find-replace.spec.js). The phase 6 shadow/iframe
    fields below are likewise prefilled with values that do NOT contain
    "hello", for the same reason - each carries its own distinct seed value
    ("shadow value" / "iframe value") so shadow/iframe-specific tests can
    target them without disturbing any existing "hello" assertion.
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Form Field Find &amp; Replace - Fixture</title>
</head>
<body>
  <h1>Fixture page</h1>

  <form id="plain-form" data-testid="plain-form">
    <label for="text-input">Text</label>
    <input
      type="text"
      id="text-input"
      data-testid="text-input"
      name="text-input"
      value="hello world hello"
    />

    <label for="email-input">Email</label>
    <input
      type="email"
      id="email-input"
      data-testid="email-input"
      name="email-input"
      value="hello@example.com"
    />

    <label for="textarea-input">Textarea</label>
    <textarea id="textarea-input" data-testid="textarea-input" name="textarea-input">hello there, hello again</textarea>

    <label for="password-input">Password (must be left untouched)</label>
    <input
      type="password"
      id="password-input"
      data-testid="password-input"
      name="password-input"
      value="hello secret"
    />
  </form>

  <div
    id="contenteditable-div"
    data-testid="contenteditable-div"
    contenteditable="true"
  ><b>hello</b> world <span>hello there</span></div>

  <label for="disabled-input">Disabled (must be skipped)</label>
  <input
    type="text"
    id="disabled-input"
    data-testid="disabled-input"
    name="disabled-input"
    value="hello disabled"
    disabled
  />

  <label for="readonly-input">Readonly (must be skipped)</label>
  <input
    type="text"
    id="readonly-input"
    data-testid="readonly-input"
    name="readonly-input"
    value="hello readonly"
    readonly
  />

  <!-- Phase 3: numeric/date input types, prefilled with valid values, to
       exercise the read-back/rollback format-validation path. -->
  <form id="numeric-date-form" data-testid="numeric-date-form">
    <label for="number-input">Number</label>
    <input
      type="number"
      id="number-input"
      data-testid="number-input"
      name="number-input"
      value="42"
    />

    <label for="date-input">Date</label>
    <input
      type="date"
      id="date-input"
      data-testid="date-input"
      name="date-input"
      value="2026-03-14"
    />

    <label for="datetime-local-input">Datetime-local</label>
    <input
      type="datetime-local"
      id="datetime-local-input"
      data-testid="datetime-local-input"
      name="datetime-local-input"
      value="2026-03-14T10:30"
    />

    <label for="month-input">Month</label>
    <input
      type="month"
      id="month-input"
      data-testid="month-input"
      name="month-input"
      value="2026-03"
    />

    <label for="week-input">Week</label>
    <input
      type="week"
      id="week-input"
      data-testid="week-input"
      name="week-input"
      value="2026-W11"
    />

    <label for="time-input">Time</label>
    <input
      type="time"
      id="time-input"
      data-testid="time-input"
      name="time-input"
      value="10:30"
    />
  </form>

  <!--
    Phase 3: a minimal controlled-input widget - a small vanilla imitation
    of React's own instance-level value tracker. React shadows the native
    `value` property with an own accessor on the DOM node so it can tell a
    "silent" programmatic write (e.g. `el.value = x`) apart from a write
    that goes through the real native prototype setter followed by a
    genuine `input` event. A silent write is reverted back to the tracked
    state; a write via the native setter (bypassing this own-property
    entirely, since it's invoked directly on the prototype's setter
    function rather than through `el.value = x` property resolution),
    followed by a real `input` event, is accepted into state and stays.

    This proves the extension's replace path must use the native-setter
    pattern - a plain `el.value = x` assignment gets silently reverted by
    this widget, exactly as it would be by React.
  -->
  <label for="controlled-input">Controlled-input widget</label>
  <input
    type="text"
    id="controlled-input"
    data-testid="controlled-input"
    name="controlled-input"
    value="state one"
  />
  <script>
    (function () {
      var el = document.getElementById("controlled-input");
      var nativeDescriptor = Object.getOwnPropertyDescriptor(
        HTMLInputElement.prototype,
        "value"
      );
      var internalState = nativeDescriptor.get.call(el);

      Object.defineProperty(el, "value", {
        configurable: true,
        enumerable: true,
        get: function () {
          return nativeDescriptor.get.call(el);
        },
        set: function () {
          // A "silent" write via plain property assignment never reaches
          // here through the native setter path - revert to the last
          // known-good state, exactly like a React controlled input
          // ignoring an out-of-band DOM mutation.
          nativeDescriptor.set.call(el, internalState);
        },
      });

      el.addEventListener("input", function () {
        // A real input event only follows a native-setter write (which
        // bypasses the defineProperty above entirely), so the current
        // native value is legitimate - accept it into state.
        internalState = nativeDescriptor.get.call(el);
      });
    })();
  </script>

  <!--
    Phase 6: a field inside an OPEN shadow root. Built with
    createElement/setAttribute rather than shadow.innerHTML, purely as
    fixture-authoring style (innerHTML itself is not a phase-6 concern -
    this file is a test fixture, not extension code, and is not in
    security-audit.sh's popup/content scan scope).

    collectFields must recurse into `#shadow-host.shadowRoot` (open) and
    find #shadow-input, proving shadow-root recursion works independent of
    the includeIframes option (it is not gated by it at all).
  -->
  <div id="shadow-host" data-testid="shadow-host"></div>
  <script>
    (function () {
      var host = document.getElementById("shadow-host");
      var shadow = host.attachShadow({ mode: "open" });
      var input = document.createElement("input");
      input.type = "text";
      input.id = "shadow-input";
      input.setAttribute("data-testid", "shadow-input");
      input.value = "shadow value";
      shadow.appendChild(input);

      // Phase 6 regression guard: the password-exclusion rule must hold
      // INSIDE a shadow root too, not just at top level. describeField is
      // applied uniformly by the single collectFields generator, but nothing
      // proved that until this field existed - a future refactor that
      // special-cased shadow traversal could silently start collecting it.
      var secret = document.createElement("input");
      secret.type = "password";
      secret.id = "shadow-password-input";
      secret.setAttribute("data-testid", "shadow-password-input");
      secret.value = "hello shadow secret";
      shadow.appendChild(secret);
    })();
  </script>

  <!--
    Phase 6: a field inside a CLOSED shadow root. `attachShadow({mode:
    "closed"})` makes `host.shadowRoot` return null from outside the shadow
    tree - collectFields must never see #closed-shadow-input, and must never
    throw trying to reach it (there is no API to "force" access to a closed
    root; it is simply absent).
  -->
  <div id="closed-shadow-host" data-testid="closed-shadow-host"></div>
  <script>
    (function () {
      var host = document.getElementById("closed-shadow-host");
      var shadow = host.attachShadow({ mode: "closed" });
      var input = document.createElement("input");
      input.type = "text";
      input.id = "closed-shadow-input";
      input.setAttribute("data-testid", "closed-shadow-input");
      input.value = "closed shadow value";
      shadow.appendChild(input);
    })();
  </script>

  <!--
    Phase 6: a same-origin iframe containing its own form field. `srcdoc`
    content inherits the parent document's origin (per the HTML spec's
    "iframe srcdoc document" rules), so this is genuinely same-origin and
    `contentDocument` is synchronously accessible from the parent once the
    iframe has fired its `load` event - tests must wait for that event
    before calling collectFields with includeIframes enabled. Collected only
    when the popup's "include iframes" option (options.includeIframes) is
    set; must be absent from a collectFields(document) call with no options.
  -->
  <iframe
    id="same-origin-iframe"
    data-testid="same-origin-iframe"
    srcdoc="&lt;!DOCTYPE html&gt;&lt;html&gt;&lt;body&gt;&lt;input type=&quot;text&quot; id=&quot;iframe-input&quot; data-testid=&quot;iframe-input&quot; value=&quot;iframe value&quot; /&gt;&lt;input type=&quot;password&quot; id=&quot;iframe-password-input&quot; data-testid=&quot;iframe-password-input&quot; value=&quot;hello iframe secret&quot; /&gt;&lt;/body&gt;&lt;/html&gt;"
  ></iframe>

  <!--
    Phase 6: a cross-origin-EQUIVALENT iframe, offline-friendly. A `src`
    pointing at a real external origin (e.g. https://example.com/) would not
    load without network access and this project makes no network calls
    (SPEC.md). Empirically, in this project's Firefox/Playwright harness, a
    `sandbox` attribute with NO `allow-same-origin` token forces the frame's
    content into a freshly-generated OPAQUE origin distinct from the parent
    regardless of `src` (even `about:blank` or a same-document srcdoc) - the
    exact mechanism the HTML spec uses for "an iframe whose content must be
    treated as cross-origin". Reading `.contentDocument` on it is exactly
    the case collectFields's try/catch must swallow quietly. No `src` is
    needed to prove this; the sandbox restriction alone is sufficient and
    keeps this fixture fully offline.
  -->
  <iframe
    id="cross-origin-iframe"
    data-testid="cross-origin-iframe"
    sandbox=""
    srcdoc="&lt;!DOCTYPE html&gt;&lt;html&gt;&lt;body&gt;&lt;input type=&quot;text&quot; id=&quot;cross-origin-input&quot; value=&quot;should never be collected&quot; /&gt;&lt;/body&gt;&lt;/html&gt;"
  ></iframe>
</body>
</html>

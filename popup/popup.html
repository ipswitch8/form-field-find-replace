<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Form Field Find &amp; Replace</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<main id="app" data-testid="app">
  <h1 id="app-title" data-testid="app-title">Form Field Find &amp; Replace</h1>

  <form id="find-replace-form" data-testid="find-replace-form" autocomplete="off">

    <!--
      Each input sits in a .combo wrapper that establishes the positioning
      context for its history overlay. The overlay is position:absolute
      (popup.css) so that opening it cannot add to the document's height - see
      README.md, "Why the dropdown is an absolutely-positioned overlay". The
      <ul> rows are created by popup.js with createElement/textContent; there
      is no markup here for them on purpose, because a remembered value is
      arbitrary user text and must never be parsed as HTML.
    -->
    <div class="field-row">
      <label for="find-input" id="find-label" data-testid="find-label">Find</label>
      <div class="combo" id="find-combo" data-testid="find-combo">
        <input
          type="text"
          id="find-input"
          name="find"
          data-testid="find-input"
          aria-describedby="status-line"
          role="combobox"
          aria-expanded="false"
          aria-controls="find-history-listbox"
          aria-autocomplete="list"
          autocomplete="off"
        >
        <div
          class="history-overlay"
          id="find-history-overlay"
          data-testid="find-history-overlay"
          hidden
        >
          <ul
            id="find-history-listbox"
            data-testid="find-history-listbox"
            role="listbox"
            aria-label="Previous searches"
          ></ul>
          <button
            type="button"
            class="history-clear"
            id="find-history-clear"
            data-testid="find-history-clear"
          >Clear history</button>
        </div>
      </div>
    </div>

    <div class="field-row">
      <label for="replace-input" id="replace-label" data-testid="replace-label">Replace with</label>
      <div class="combo" id="replace-combo" data-testid="replace-combo">
        <input
          type="text"
          id="replace-input"
          name="replace"
          data-testid="replace-input"
          role="combobox"
          aria-expanded="false"
          aria-controls="replace-history-listbox"
          aria-autocomplete="list"
          autocomplete="off"
        >
        <div
          class="history-overlay"
          id="replace-history-overlay"
          data-testid="replace-history-overlay"
          hidden
        >
          <ul
            id="replace-history-listbox"
            data-testid="replace-history-listbox"
            role="listbox"
            aria-label="Previous replacements"
          ></ul>
          <button
            type="button"
            class="history-clear"
            id="replace-history-clear"
            data-testid="replace-history-clear"
          >Clear history</button>
        </div>
      </div>
    </div>

    <div id="match-preview-row" class="field-row" data-testid="match-preview-row">
      <span id="match-preview-label" data-testid="match-preview-label">Preview</span>
      <output
        id="match-preview"
        data-testid="match-preview"
        for="find-input replace-input"
      ></output>
    </div>

    <fieldset id="options-fieldset" data-testid="options-fieldset">
      <legend>Options</legend>

      <div class="checkbox-row">
        <input type="checkbox" id="match-case-checkbox" name="matchCase" data-testid="match-case-checkbox">
        <label for="match-case-checkbox" data-testid="match-case-label">Match case</label>
      </div>

      <div class="checkbox-row">
        <input type="checkbox" id="whole-word-checkbox" name="wholeWord" data-testid="whole-word-checkbox">
        <label for="whole-word-checkbox" data-testid="whole-word-label">Whole word</label>
      </div>

      <div class="checkbox-row">
        <input type="checkbox" id="regex-checkbox" name="regex" data-testid="regex-checkbox">
        <label for="regex-checkbox" data-testid="regex-label">Regular expression</label>
      </div>

      <div class="checkbox-row">
        <input type="checkbox" id="include-iframes-checkbox" name="includeIframes" data-testid="include-iframes-checkbox">
        <label for="include-iframes-checkbox" data-testid="include-iframes-label">Include iframes</label>
      </div>
    </fieldset>

    <section id="field-types-section" data-testid="field-types-section">
      <h2 id="field-types-heading" data-testid="field-types-heading">
        <button
          type="button"
          id="field-types-toggle"
          data-testid="field-types-toggle"
          aria-expanded="true"
          aria-controls="field-types-content"
        >
          Field types
        </button>
      </h2>

      <div id="field-types-content" data-testid="field-types-content">

        <div class="field-types-actions">
          <a href="#" id="field-types-select-all" data-testid="field-types-select-all" role="button">Select all</a>
          <a href="#" id="field-types-select-none" data-testid="field-types-select-none" role="button">Select none</a>
        </div>

        <fieldset class="field-type-group" id="fieldtype-group-text" data-testid="fieldtype-group-text">
          <legend>Text</legend>
          <div class="checkbox-row">
            <input type="checkbox" class="field-type-checkbox" id="fieldtype-text" data-testid="fieldtype-text" data-field-type="text" checked>
            <label for="fieldtype-text" data-testid="fieldtype-text-label">text</label>
          </div>
          <div class="checkbox-row">
            <input type="checkbox" class="field-type-checkbox" id="fieldtype-search" data-testid="fieldtype-search" data-field-type="search" checked>
            <label for="fieldtype-search" data-testid="fieldtype-search-label">search</label>
          </div>
          <div class="checkbox-row">
            <input type="checkbox" class="field-type-checkbox" id="fieldtype-url" data-testid="fieldtype-url" data-field-type="url" checked>
            <label for="fieldtype-url" data-testid="fieldtype-url-label">url</label>
          </div>
          <div class="checkbox-row">
            <input type="checkbox" class="field-type-checkbox" id="fieldtype-tel" data-testid="fieldtype-tel" data-field-type="tel" checked>
            <label for="fieldtype-tel" data-testid="fieldtype-tel-label">tel</label>
          </div>
          <div class="checkbox-row">
            <input type="checkbox" class="field-type-checkbox" id="fieldtype-email" data-testid="fieldtype-email" data-field-type="email" checked>
            <label for="fieldtype-email" data-testid="fieldtype-email-label">email</label>
          </div>
        </fieldset>

        <fieldset class="field-type-group" id="fieldtype-group-numeric" data-testid="fieldtype-group-numeric">
          <legend>Numeric and date</legend>
          <div class="checkbox-row">
            <input type="checkbox" class="field-type-checkbox" id="fieldtype-number" data-testid="fieldtype-number" data-field-type="number">
            <label for="fieldtype-number" data-testid="fieldtype-number-label">number</label>
          </div>
          <div class="checkbox-row">
            <input type="checkbox" class="field-type-checkbox" id="fieldtype-date" data-testid="fieldtype-date" data-field-type="date">
            <label for="fieldtype-date" data-testid="fieldtype-date-label">date</label>
          </div>
          <div class="checkbox-row">
            <input type="checkbox" class="field-type-checkbox" id="fieldtype-datetime-local" data-testid="fieldtype-datetime-local" data-field-type="datetime-local">
            <label for="fieldtype-datetime-local" data-testid="fieldtype-datetime-local-label">datetime-local</label>
          </div>
          <div class="checkbox-row">
            <input type="checkbox" class="field-type-checkbox" id="fieldtype-month" data-testid="fieldtype-month" data-field-type="month">
            <label for="fieldtype-month" data-testid="fieldtype-month-label">month</label>
          </div>
          <div class="checkbox-row">
            <input type="checkbox" class="field-type-checkbox" id="fieldtype-week" data-testid="fieldtype-week" data-field-type="week">
            <label for="fieldtype-week" data-testid="fieldtype-week-label">week</label>
          </div>
          <div class="checkbox-row">
            <input type="checkbox" class="field-type-checkbox" id="fieldtype-time" data-testid="fieldtype-time" data-field-type="time">
            <label for="fieldtype-time" data-testid="fieldtype-time-label">time</label>
          </div>
        </fieldset>

        <fieldset class="field-type-group" id="fieldtype-group-multiline" data-testid="fieldtype-group-multiline">
          <legend>Multi-line</legend>
          <div class="checkbox-row">
            <input type="checkbox" class="field-type-checkbox" id="fieldtype-textarea" data-testid="fieldtype-textarea" data-field-type="textarea" checked>
            <label for="fieldtype-textarea" data-testid="fieldtype-textarea-label">textarea</label>
          </div>
        </fieldset>

        <fieldset class="field-type-group" id="fieldtype-group-richtext" data-testid="fieldtype-group-richtext">
          <legend>Rich text</legend>
          <div class="checkbox-row">
            <input type="checkbox" class="field-type-checkbox" id="fieldtype-contenteditable" data-testid="fieldtype-contenteditable" data-field-type="contenteditable" checked>
            <label for="fieldtype-contenteditable" data-testid="fieldtype-contenteditable-label">contenteditable</label>
          </div>
        </fieldset>

      </div>
    </section>

    <div id="actions-row" data-testid="actions-row">
      <button type="button" id="count-btn" data-testid="count-btn">Count matches</button>
      <button type="submit" id="replace-all-btn" data-testid="replace-all-btn">Replace all</button>
      <button type="button" id="undo-btn" data-testid="undo-btn" disabled>Undo last replace</button>
      <button type="button" id="cancel-btn" data-testid="cancel-btn" disabled>Cancel</button>
    </div>

    <p id="undo-note" data-testid="undo-note">Only one level of undo is supported.</p>

    <div
      id="undo-warning"
      data-testid="undo-warning"
      role="alert"
      aria-live="assertive"
      hidden
    ></div>

    <div id="progress-row" data-testid="progress-row">
      <progress
        id="progress-bar"
        data-testid="progress-bar"
        role="progressbar"
        aria-valuenow="0"
        aria-valuemin="0"
        aria-valuemax="100"
        value="0"
        max="100"
      ></progress>
      <span id="field-counter" data-testid="field-counter" aria-live="polite">field 0 of 0</span>
    </div>

    <div id="status-line" data-testid="status-line" role="status" aria-live="polite"></div>

  </form>
</main>
<!--
  Loaded so the popup's live match preview (popup.js) can call the exact
  same buildMatcher()/computeFirstMatchPreview() functions the content
  script uses for count/replace - never a second, duplicated matching
  implementation. Safe to load here: this file guards its
  browser.runtime.onMessage registration behind an extension-API check, and
  even where that guard passes (the popup does have a runtime API) nothing
  ever calls browser.runtime.sendMessage to trigger it - the popup always
  talks to the page via browser.tabs.sendMessage instead. It never touches
  document fields unless a count/replace action message is explicitly
  handled, which never happens in the popup's own document.
-->
<script src="../content/find-replace.js"></script>
<script src="popup.js"></script>
</body>
</html>
